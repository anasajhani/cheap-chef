services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cheapchef
      POSTGRES_USER: cheapchef
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cheap-chef-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheapchef"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgres://cheapchef:${POSTGRES_PASSWORD}@db:5432/cheapchef
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  cheap-chef-data:
